# Local litellm proxy that serves Claude on Vertex AI to the pi agent runtime (pi provider
# "vertex-litellm" in harness/pi-home/models.json points at this port). Set VERTEX_PROJECT
# and, optionally, VERTEX_LOCATION in the environment before scripts/litellm_up.sh.
model_list:
  - model_name: claude-opus-4-8
    litellm_params:
      model: vertex_ai/claude-opus-4-8
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

litellm_settings:
  drop_params: true
  request_timeout: 1800

# Not a secret: the proxy listens on localhost only and this key merely has to match
# the apiKey in harness/pi-home/models.json.
general_settings:
  master_key: veriharness-local-proxy
