# Judge model for WorkBuddy's rubric verifier (office and web tasks), as the benchmark's
# archived runs were judged: gemini-3.5-flash through an OpenAI-compatible endpoint named
# by WB_LITELLM_BASE_URL / WB_LITELLM_API_KEY (see harness/benchmarks/wb/env.example).
# reasoning_effort is set explicitly; 3.5-flash maps it to a discrete thinking level.
model:
  name: gemini-3.5-flash
  protocols: [openai]
  backend_url_env: WB_LITELLM_BASE_URL
  backend_key_env: WB_LITELLM_API_KEY
  context_window: 1000000
  params:
    max_output_tokens: 65536
    extra_body:
      reasoning_effort: high
